naftiko: 1.0.0-alpha2
info:
  label: Tripadvisor Hotel Availability Check API — Availability
  description: 'Tripadvisor Hotel Availability Check API — Availability. 1 operations. Lead operation: Check Hotel Availability.
    Self-contained Naftiko capability covering one Tripadvisor business surface.'
  tags:
  - Tripadvisor
  - Availability
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TRIPADVISOR_API_KEY: TRIPADVISOR_API_KEY
capability:
  consumes:
  - type: http
    namespace: hotel-availability-check-availability
    baseUri: https://{partnerEndpoint}
    description: Tripadvisor Hotel Availability Check API — Availability business capability. Self-contained, no shared references.
    resources:
    - name: availability
      path: /availability
      operations:
      - name: checkavailability
        method: POST
        description: Check Hotel Availability
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
  exposes:
  - type: rest
    namespace: hotel-availability-check-availability-rest
    port: 8080
    description: REST adapter for Tripadvisor Hotel Availability Check API — Availability. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/availability
      name: availability
      description: REST surface for availability.
      operations:
      - method: POST
        name: checkavailability
        description: Check Hotel Availability
        call: hotel-availability-check-availability.checkavailability
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: hotel-availability-check-availability-mcp
    port: 9090
    transport: http
    description: MCP adapter for Tripadvisor Hotel Availability Check API — Availability. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: check-hotel-availability
      description: Check Hotel Availability
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: hotel-availability-check-availability.checkavailability
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
