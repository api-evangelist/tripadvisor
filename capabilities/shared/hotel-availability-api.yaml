naftiko: "1.0.0-alpha1"

info:
  label: "Tripadvisor Hotel Availability Check API"
  description: "Partner-side API that Tripadvisor queries to retrieve real-time hotel availability and pricing for display on hotel pages."
  tags:
    - Availability
    - Booking
    - Hotels
    - Hospitality
    - Travel
  created: "2026-05-03"
  modified: "2026-05-03"

binds:
  - namespace: env
    keys:
      TRIPADVISOR_API_KEY: TRIPADVISOR_API_KEY
      PARTNER_ENDPOINT: PARTNER_ENDPOINT

capability:
  consumes:
    - type: http
      namespace: tripadvisor-hac
      baseUri: "https://{{env.PARTNER_ENDPOINT}}"
      description: "Hotel Availability Check - partner endpoint that Tripadvisor calls"
      resources:
        - name: config
          path: /config
          description: "Partner configuration discovery"
          operations:
            - name: get-partner-configuration
              method: GET
              description: "Get partner supported features and API version"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: inventory
          path: /inventory
          description: "Hotel inventory registration"
          operations:
            - name: get-hotel-inventory
              method: GET
              description: "Get full list of hotels the partner can provide availability for"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: availability
          path: /availability
          description: "Real-time hotel availability and pricing"
          operations:
            - name: check-hotel-availability
              method: POST
              description: "Check real-time availability and pricing for one or more hotels"
              inputParameters:
                - name: api_version
                  in: body
                  type: integer
                  required: true
                  description: "API version number"
                - name: check_in
                  in: body
                  type: string
                  required: true
                  description: "Check-in date (YYYY-MM-DD)"
                - name: check_out
                  in: body
                  type: string
                  required: true
                  description: "Check-out date (YYYY-MM-DD)"
                - name: num_adults
                  in: body
                  type: integer
                  required: true
                  description: "Number of adult guests"
                - name: hotel_ids
                  in: body
                  type: array
                  required: true
                  description: "List of hotel IDs to check"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  api_version: "{{tools.api_version}}"
                  check_in: "{{tools.check_in}}"
                  check_out: "{{tools.check_out}}"
                  num_adults: "{{tools.num_adults}}"
                  hotel_ids: "{{tools.hotel_ids}}"

  exposes:
    - type: rest
      port: 8101
      namespace: tripadvisor-hac-rest
      resources:
        - path: /v1/hotels/availability
          name: availability
          description: "Hotel availability check"
          operations:
            - method: POST
              name: check-availability
              description: "Check hotel availability and pricing"
              call: "tripadvisor-hac.check-hotel-availability"
              with:
                check_in: "rest.body.check_in"
                check_out: "rest.body.check_out"
                num_adults: "rest.body.num_adults"
                hotel_ids: "rest.body.hotel_ids"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9101
      namespace: tripadvisor-hac-mcp
      transport: http
      tools:
        - name: check-hotel-availability
          description: "Check real-time hotel availability and pricing for specific dates"
          hints:
            readOnly: true
            openWorld: false
          call: "tripadvisor-hac.check-hotel-availability"
          with:
            check_in: "tools.check_in"
            check_out: "tools.check_out"
            num_adults: "tools.num_adults"
            hotel_ids: "tools.hotel_ids"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-hotel-inventory
          description: "Get the full list of hotels available through this connectivity partner"
          hints:
            readOnly: true
            openWorld: false
          call: "tripadvisor-hac.get-hotel-inventory"
          outputParameters:
            - type: object
              mapping: "$."
