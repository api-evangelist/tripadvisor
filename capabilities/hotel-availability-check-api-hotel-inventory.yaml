naftiko: "1.0.0-alpha2"

info:
  label: "Tripadvisor Hotel Availability Check API — Hotel Inventory"
  description: >-
    Hotel Inventory — the daily-pull endpoint a connectivity partner implements
    so Tripadvisor can map the partner's connected properties to Tripadvisor
    listings. 1 operation. Lead operation: Get Hotel Inventory returns the
    partner's complete list of connected hotels with Tripadvisor and partner
    identifiers. This surface is partner-hosted and queried by Tripadvisor once
    per day. Self-contained Naftiko capability covering one Tripadvisor business
    surface.
  tags:
    - Tripadvisor
    - Connectivity
    - Hotel Inventory
  created: "2026-06-03"
  modified: "2026-06-03"

binds:
  - namespace: env
    keys:
      TRIPADVISOR_PARTNER_ENDPOINT: TRIPADVISOR_PARTNER_ENDPOINT

capability:

  # ── 1. Consumes — the partner-hosted endpoint Tripadvisor queries ─────
  consumes:
    - type: http
      namespace: "hotel-availability-check-api-hotel-inventory"
      baseUri: "https://{{env.TRIPADVISOR_PARTNER_ENDPOINT}}"
      description: "Tripadvisor Hotel Availability Check API — Hotel Inventory business capability. Partner-hosted, no authentication; Tripadvisor is the caller. Self-contained, no shared references."
      resources:
        - name: "hotel-inventory"
          path: "/hotel_inventory"
          operations:
            - name: "getHotelInventory"
              method: GET
              description: "Returns the partner's full list of hotel properties connected for availability checking."
              inputParameters:
                - name: "api_version"
                  in: query
                  type: integer
                  required: true
                  description: "The API version number. Current version is 8."
                - name: "lang"
                  in: query
                  type: string
                  required: false
                  description: "The language code for the response content."
                - name: "inventory_type"
                  in: query
                  type: string
                  required: false
                  description: "The type of inventory integration (e.g. tripconnect)."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  # ── 2. REST exposer — one Spectral-compliant resource per consumed op ──
  exposes:
    - type: rest
      namespace: "hotel-availability-check-api-hotel-inventory-rest"
      port: 8080
      description: "REST adapter for Tripadvisor Hotel Availability Check API — Hotel Inventory. One Spectral-compliant resource per consumed operation, prefixed with /v1."
      resources:
        - path: "/v1/hotel-inventory"
          name: "hotel-inventory"
          description: "REST surface for partner hotel inventory."
          operations:
            - method: GET
              name: "getHotelInventory"
              description: "Returns the partner's full list of hotel properties connected for availability checking."
              call: "hotel-availability-check-api-hotel-inventory.getHotelInventory"
              with:
                "api_version": "rest.api_version"
                "lang": "rest.lang"
                "inventory_type": "rest.inventory_type"
              outputParameters:
                - type: object
                  mapping: "$."

  # ── 3. MCP exposer — one verb-noun tool per consumed op ──
    - type: mcp
      namespace: "hotel-availability-check-api-hotel-inventory-mcp"
      port: 9090
      transport: http
      description: "MCP adapter for Tripadvisor Hotel Availability Check API — Hotel Inventory. One tool per consumed operation, routed inline through this capability's consumes block."
      tools:
        - name: "get-hotel-inventory"
          description: "Returns the partner's full list of hotel properties connected for availability checking."
          hints:
            readOnly: true
            destructive: false
            idempotent: true
          call: "hotel-availability-check-api-hotel-inventory.getHotelInventory"
          with:
            "api_version": "tools.api_version"
            "lang": "tools.lang"
            "inventory_type": "tools.inventory_type"
          outputParameters:
            - type: object
              mapping: "$."
