meters:
  - name: api_calls_total
    unit: request
    aggregation: sum
    dimensions:
      - endpoint
      - api_key
  - name: api_calls_search
    unit: request
    aggregation: sum
    dimensions:
      - api_key
  - name: api_calls_free_tier
    unit: request
    aggregation: sum
    dimensions:
      - api_key
  - name: daily_budget_consumed
    unit: USD
    aggregation: sum
    dimensions:
      - api_key
principles:
  - name: Visibility
    description: Track consumption against the free 5,000-call monthly allotment and the customer-set
      daily budget cap on the My Usage page (data appears within 24 hours).
  - name: Allocation
    description: Allocate cost per API key; rotate or partition keys per consuming product / property
      so the My Usage view doubles as a chargeback ledger.
  - name: Optimization
    description: Stay inside the 5,000-call/month free tier when possible; lower the customer-set
      daily budget to enforce hard ceilings; cache popular Location and Review responses to absorb
      bursts under the 50 calls/sec ceiling; if consistently over 500K calls/month, contact sales
      for volume tier pricing.
  - name: Accountability
    description: API key owner is the spend owner; the customer-set daily budget cap is the primary
      hard guardrail and 429 responses are the user-facing accountability signal.
maintainers:
