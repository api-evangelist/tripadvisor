name: Tripadvisor
description: Tripadvisor is the world's largest travel guidance platform, helping
  hundreds of millions of travelers each month find places to stay, things to do,
  and restaurants through reviews, photos, and tools. The platform maintains over
  7.5 million locations and 1 billion reviews across 43 markets and 29 languages.
  Tripadvisor provides APIs for content integration, hotel connectivity, and restaurant
  reservations.
