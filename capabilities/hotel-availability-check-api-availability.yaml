naftiko: "1.0.0-alpha2"

info:
  label: "Tripadvisor Hotel Availability Check API — Availability"
  description: >-
    Availability — the real-time price-and-availability endpoint a connectivity
    partner implements for Tripadvisor to call. 1 operation. Lead operation:
    Check Hotel Availability accepts a form-urlencoded batch of one-to-many
    hotels and returns current room pricing within a 5-second budget. This
    surface is partner-hosted and queried by Tripadvisor. Self-contained Naftiko
    capability covering one Tripadvisor business surface.
  tags:
    - Tripadvisor
    - Connectivity
    - Availability
  created: "2026-06-03"
  modified: "2026-06-03"

binds:
  - namespace: env
    keys:
      TRIPADVISOR_PARTNER_ENDPOINT: TRIPADVISOR_PARTNER_ENDPOINT

capability:

  # ── 1. Consumes — the partner-hosted endpoint Tripadvisor queries ─────
  consumes:
    - type: http
      namespace: "hotel-availability-check-api-availability"
      baseUri: "https://{{env.TRIPADVISOR_PARTNER_ENDPOINT}}"
      description: "Tripadvisor Hotel Availability Check API — Availability business capability. Partner-hosted, no authentication; Tripadvisor is the caller. Self-contained, no shared references."
      resources:
        - name: "availability"
          path: "/availability"
          operations:
            - name: "checkAvailability"
              method: POST
              description: "Called by Tripadvisor in real-time to retrieve current pricing and availability for one-to-many hotels."
              inputParameters:
                - name: "body"
                  in: body
                  type: object
                  required: true
                  description: "Form-urlencoded availability request covering one-to-many hotels, check-in/out dates, and party composition."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  # ── 2. REST exposer — one Spectral-compliant resource per consumed op ──
  exposes:
    - type: rest
      namespace: "hotel-availability-check-api-availability-rest"
      port: 8080
      description: "REST adapter for Tripadvisor Hotel Availability Check API — Availability. One Spectral-compliant resource per consumed operation, prefixed with /v1."
      resources:
        - path: "/v1/availability"
          name: "availability"
          description: "REST surface for hotel availability checks."
          operations:
            - method: POST
              name: "checkAvailability"
              description: "Retrieve current pricing and availability for one-to-many hotels."
              call: "hotel-availability-check-api-availability.checkAvailability"
              with:
                "body": "rest.body"
              outputParameters:
                - type: object
                  mapping: "$."

  # ── 3. MCP exposer — one verb-noun tool per consumed op ──
    - type: mcp
      namespace: "hotel-availability-check-api-availability-mcp"
      port: 9090
      transport: http
      description: "MCP adapter for Tripadvisor Hotel Availability Check API — Availability. One tool per consumed operation, routed inline through this capability's consumes block."
      tools:
        - name: "check-hotel-availability"
          description: "Retrieve current pricing and availability for one-to-many hotels."
          hints:
            readOnly: false
            destructive: false
            idempotent: false
          call: "hotel-availability-check-api-availability.checkAvailability"
          with:
            "body": "tools.body"
          outputParameters:
            - type: object
              mapping: "$."
