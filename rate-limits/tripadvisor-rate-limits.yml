specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Tripadvisor
providerId: tripadvisor
created: '2026-05-04'
modified: '2026-05-05'
reconciled: true
tags:
  - Travel
  - Reviews
  - Hospitality
  - Rate Limiting
description: Tripadvisor Content API enforces a published per-second rate limit, a daily call cap on
  Search, and a customer-selected daily budget cap. Calls beyond the daily limit return 429.
sources:
  - https://tripadvisor-content-api.readme.io/reference/overview
  - https://tripadvisor-content-api.readme.io/reference/faq
responseCodes:
  throttled: 429
  quotaExceeded: 429
limits:
  - name: Per-Second Rate Limit
    scope: key
    metric: requests_per_second
    limit: 50
    timeFrame: second
    notes: Documented as "up to 50 calls per second" on the Content API overview.
  - name: Search API Daily Cap
    scope: key
    metric: requests_per_day
    limit: 10000
    timeFrame: day
    notes: Search endpoints specifically allow up to 10,000 calls per day before throttling.
  - name: Daily Budget Cap
    scope: key
    metric: varies
    limit: customer-selected at signup
    notes: Customer chooses a daily USD budget at signup; calls beyond it return 429.
policies:
  - name: 429 On Daily Cap
    description: Calls made after the daily Search cap or daily budget cap is hit return HTTP 429
      until the next UTC day.
  - name: Usage Reporting Delay
    description: Usage metrics appear on the My Usage page within ~24 hours of the call.
  - name: Volume Tier Routing
    description: Consumers exceeding 500,000 calls per month are directed to contact sales for
      volume pricing rather than continuing self-serve.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
