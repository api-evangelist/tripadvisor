naftiko: 1.0.0-alpha2
info:
  label: Tripadvisor Travel Content
  description: Workflow capability for integrating Tripadvisor's travel content into applications. Combines location search,
    detail retrieval, photos, and reviews into a unified travel discovery and content enrichment workflow. Designed for travel
    apps, destination guides, hotel comparison sites, and restaurant recommendation platforms.
  tags:
  - Attractions
  - Content
  - Hotels
  - Locations
  - Restaurants
  - Reviews
  - Travel
  created: '2026-05-03'
  modified: '2026-05-06'
binds:
- namespace: env
  keys:
    TRIPADVISOR_API_KEY: TRIPADVISOR_API_KEY
capability:
  consumes:
  - type: http
    namespace: tripadvisor-content
    baseUri: https://api.content.tripadvisor.com/api/v1
    description: Tripadvisor Content API for location data, reviews, and photos
    authentication:
      type: apikey
      key: key
      value: '{{env.TRIPADVISOR_API_KEY}}'
      placement: query
    resources:
    - name: location-search
      path: /location/search
      description: Search for locations by keyword or address
      operations:
      - name: search-for-locations
        method: GET
        description: Search for up to 10 locations by query, category, phone, address, or coordinates
        inputParameters:
        - name: searchQuery
          in: query
          type: string
          required: true
          description: Search query (name or keyword)
        - name: category
          in: query
          type: string
          required: false
          description: 'Filter by category: hotels, restaurants, attractions, geos'
        - name: language
          in: query
          type: string
          required: false
          description: ISO 639 language code for response
        - name: latLong
          in: query
          type: string
          required: false
          description: Latitude and longitude for geographic context
        - name: radius
          in: query
          type: integer
          required: false
          description: Search radius
        - name: radiusUnit
          in: query
          type: string
          required: false
          description: km or mi
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: nearby-search
      path: /location/nearby_search
      description: Search for locations near a geographic point
      operations:
      - name: search-for-nearby-locations
        method: GET
        description: Search for up to 10 locations near the given latitude/longitude
        inputParameters:
        - name: latLong
          in: query
          type: string
          required: true
          description: Latitude,longitude coordinates
        - name: category
          in: query
          type: string
          required: false
          description: Filter by category
        - name: language
          in: query
          type: string
          required: false
          description: ISO 639 language code
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: location-details
      path: /location/{locationId}/details
      description: Retrieve comprehensive details for a specific location
      operations:
      - name: get-location-details
        method: GET
        description: Get name, address, rating, reviews count, and Tripadvisor URL for a location
        inputParameters:
        - name: locationId
          in: path
          type: string
          required: true
          description: Tripadvisor location identifier
        - name: language
          in: query
          type: string
          required: false
          description: ISO 639 language code
        - name: currency
          in: query
          type: string
          required: false
          description: ISO 4217 currency code
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: location-photos
      path: /location/{locationId}/photos
      description: Retrieve recent high-quality photos for a location
      operations:
      - name: get-location-photos
        method: GET
        description: Get photos for a location in multiple size formats
        inputParameters:
        - name: locationId
          in: path
          type: string
          required: true
          description: Tripadvisor location identifier
        - name: language
          in: query
          type: string
          required: false
          description: ISO 639 language code
        - name: limit
          in: query
          type: integer
          required: false
          description: Number of photos to return
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: location-reviews
      path: /location/{locationId}/reviews
      description: Retrieve the most recent reviews for a location
      operations:
      - name: get-location-reviews
        method: GET
        description: Get up to 5 most recent reviews for a location
        inputParameters:
        - name: locationId
          in: path
          type: string
          required: true
          description: Tripadvisor location identifier
        - name: language
          in: query
          type: string
          required: false
          description: ISO 639 language code for review content
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8080
    namespace: tripadvisor-travel-content-api
    description: Unified REST API for discovering and displaying Tripadvisor travel content.
    resources:
    - path: /v1/locations/search
      name: location-search
      description: Search for hotels, restaurants, and attractions
      operations:
      - method: GET
        name: search-locations
        description: Search Tripadvisor for locations by keyword and category
        call: tripadvisor-content.search-for-locations
        with:
          searchQuery: rest.searchQuery
          category: rest.category
          language: rest.language
          latLong: rest.latLong
          radius: rest.radius
          radiusUnit: rest.radiusUnit
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/locations/nearby
      name: nearby-search
      description: Find nearby locations by coordinates
      operations:
      - method: GET
        name: search-nearby
        description: Find locations near a specific latitude/longitude
        call: tripadvisor-content.search-for-nearby-locations
        with:
          latLong: rest.latLong
          category: rest.category
          language: rest.language
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/locations/{locationId}
      name: location-details
      description: Get full details for a specific location
      operations:
      - method: GET
        name: get-location
        description: Get name, address, rating, and listing URL for a location
        call: tripadvisor-content.get-location-details
        with:
          locationId: rest.locationId
          language: rest.language
          currency: rest.currency
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/locations/{locationId}/photos
      name: location-photos
      description: Get photos for a location
      operations:
      - method: GET
        name: get-photos
        description: Get recent photos in multiple sizes
        call: tripadvisor-content.get-location-photos
        with:
          locationId: rest.locationId
          language: rest.language
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/locations/{locationId}/reviews
      name: location-reviews
      description: Get recent traveler reviews
      operations:
      - method: GET
        name: get-reviews
        description: Get up to 5 most recent reviews for a location
        call: tripadvisor-content.get-location-reviews
        with:
          locationId: rest.locationId
          language: rest.language
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9090
    namespace: tripadvisor-travel-content-mcp
    transport: http
    description: MCP server for AI-assisted travel content discovery and enrichment using Tripadvisor.
    tools:
    - name: search-travel-locations
      description: Search Tripadvisor for hotels, restaurants, or attractions by keyword, category, address, or geographic
        coordinates. Returns up to 10 matching locations with IDs, names, and addresses.
      hints:
        readOnly: true
        openWorld: true
      call: tripadvisor-content.search-for-locations
      with:
        searchQuery: tools.searchQuery
        category: tools.category
        language: tools.language
        latLong: tools.latLong
        radius: tools.radius
        radiusUnit: tools.radiusUnit
      outputParameters:
      - type: object
        mapping: $.
    - name: find-nearby-attractions
      description: Find hotels, restaurants, or attractions near a specific geographic point. Provide latitude and longitude
        to discover what's nearby.
      hints:
        readOnly: true
        openWorld: true
      call: tripadvisor-content.search-for-nearby-locations
      with:
        latLong: tools.latLong
        category: tools.category
        language: tools.language
      outputParameters:
      - type: object
        mapping: $.
    - name: get-location-details
      description: Get comprehensive details for a Tripadvisor location including name, address, overall rating, review count,
        ranking, categories, trip types, and direct link to the Tripadvisor listing.
      hints:
        readOnly: true
        openWorld: false
      call: tripadvisor-content.get-location-details
      with:
        locationId: tools.locationId
        language: tools.language
        currency: tools.currency
      outputParameters:
      - type: object
        mapping: $.
    - name: get-location-photos
      description: Get recent high-quality photos for a Tripadvisor location. Returns photos in multiple size formats (thumbnail,
        small, medium, large, original).
      hints:
        readOnly: true
        openWorld: false
      call: tripadvisor-content.get-location-photos
      with:
        locationId: tools.locationId
        language: tools.language
      outputParameters:
      - type: object
        mapping: $.
    - name: get-traveler-reviews
      description: Get the most recent traveler reviews for a Tripadvisor location. Reviews include rating, text, author,
        travel date, and trip type.
      hints:
        readOnly: true
        openWorld: false
      call: tripadvisor-content.get-location-reviews
      with:
        locationId: tools.locationId
        language: tools.language
      outputParameters:
      - type: object
        mapping: $.
