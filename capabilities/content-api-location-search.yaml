naftiko: "1.0.0-alpha2"

info:
  label: "Tripadvisor Content API — Location Search"
  description: >-
    Location Search — search across Tripadvisor's 7.5M hotels, restaurants, and
    attractions. 2 operations. Lead operation: Search for Locations by keyword
    query, with optional category, phone, address, and lat/long refinement;
    paired with Search for Nearby Locations around a coordinate. Self-contained
    Naftiko capability covering one Tripadvisor business surface.
  tags:
    - Tripadvisor
    - Content
    - Location Search
  created: "2026-06-03"
  modified: "2026-06-03"

binds:
  - namespace: env
    keys:
      TRIPADVISOR_API_KEY: TRIPADVISOR_API_KEY

capability:

  # ── 1. Consumes — the upstream HTTP API this capability speaks to ─────
  consumes:
    - type: http
      namespace: "content-api-location-search"
      baseUri: "https://api.content.tripadvisor.com/api/v1"
      description: "Tripadvisor Content API — Location Search business capability. Self-contained, no shared references."
      authentication:
        type: apikey
        key: key
        value: "{{env.TRIPADVISOR_API_KEY}}"
        placement: query
      resources:
        - name: "location-search"
          path: "/location/search"
          operations:
            - name: "searchForLocations"
              method: GET
              description: "Returns up to 10 locations found by the given search query."
              inputParameters:
                - name: "searchQuery"
                  in: query
                  type: string
                  required: true
                  description: "The text query to search for matching locations."
                - name: "category"
                  in: query
                  type: string
                  required: false
                  description: "Filter results by location category (hotels, attractions, restaurants, geos)."
                - name: "phone"
                  in: query
                  type: string
                  required: false
                  description: "Phone number to search for a specific location."
                - name: "address"
                  in: query
                  type: string
                  required: false
                  description: "Address string to improve search accuracy."
                - name: "latLong"
                  in: query
                  type: string
                  required: false
                  description: "Latitude,longitude pair to bias results toward a geographic area."
                - name: "radius"
                  in: query
                  type: number
                  required: false
                  description: "The radius distance from the latLong point to filter results."
                - name: "radiusUnit"
                  in: query
                  type: string
                  required: false
                  description: "The unit of measurement for radius (km or mi)."
                - name: "language"
                  in: query
                  type: string
                  required: false
                  description: "The language code for the response content."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: "location-nearby-search"
          path: "/location/nearby_search"
          operations:
            - name: "searchForNearbyLocations"
              method: GET
              description: "Returns up to 10 locations found near the given latitude and longitude."
              inputParameters:
                - name: "latLong"
                  in: query
                  type: string
                  required: true
                  description: "Latitude,longitude pair for the center of the nearby search."
                - name: "category"
                  in: query
                  type: string
                  required: false
                  description: "Filter results by location category (hotels, attractions, restaurants, geos)."
                - name: "phone"
                  in: query
                  type: string
                  required: false
                  description: "Phone number to search for a specific location."
                - name: "address"
                  in: query
                  type: string
                  required: false
                  description: "Address string to improve search accuracy."
                - name: "radius"
                  in: query
                  type: number
                  required: false
                  description: "The radius distance from the latLong point to filter results."
                - name: "radiusUnit"
                  in: query
                  type: string
                  required: false
                  description: "The unit of measurement for radius (km or mi)."
                - name: "language"
                  in: query
                  type: string
                  required: false
                  description: "The language code for the response content."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  # ── 2. REST exposer — one Spectral-compliant resource per consumed op ──
  exposes:
    - type: rest
      namespace: "content-api-location-search-rest"
      port: 8080
      description: "REST adapter for Tripadvisor Content API — Location Search. One Spectral-compliant resource per consumed operation, prefixed with /v1."
      resources:
        - path: "/v1/location/search"
          name: "location-search"
          description: "REST surface for location keyword search."
          operations:
            - method: GET
              name: "searchForLocations"
              description: "Returns up to 10 locations found by the given search query."
              call: "content-api-location-search.searchForLocations"
              with:
                "searchQuery": "rest.searchQuery"
                "category": "rest.category"
                "phone": "rest.phone"
                "address": "rest.address"
                "latLong": "rest.latLong"
                "radius": "rest.radius"
                "radiusUnit": "rest.radiusUnit"
                "language": "rest.language"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: "/v1/location/nearby-search"
          name: "location-nearby-search"
          description: "REST surface for nearby location search."
          operations:
            - method: GET
              name: "searchForNearbyLocations"
              description: "Returns up to 10 locations found near the given latitude and longitude."
              call: "content-api-location-search.searchForNearbyLocations"
              with:
                "latLong": "rest.latLong"
                "category": "rest.category"
                "phone": "rest.phone"
                "address": "rest.address"
                "radius": "rest.radius"
                "radiusUnit": "rest.radiusUnit"
                "language": "rest.language"
              outputParameters:
                - type: object
                  mapping: "$."

  # ── 3. MCP exposer — one verb-noun tool per consumed op ──
    - type: mcp
      namespace: "content-api-location-search-mcp"
      port: 9090
      transport: http
      description: "MCP adapter for Tripadvisor Content API — Location Search. One tool per consumed operation, routed inline through this capability's consumes block."
      tools:
        - name: "search-locations"
          description: "Returns up to 10 locations found by the given search query."
          hints:
            readOnly: true
            destructive: false
            idempotent: true
          call: "content-api-location-search.searchForLocations"
          with:
            "searchQuery": "tools.searchQuery"
            "category": "tools.category"
            "phone": "tools.phone"
            "address": "tools.address"
            "latLong": "tools.latLong"
            "radius": "tools.radius"
            "radiusUnit": "tools.radiusUnit"
            "language": "tools.language"
          outputParameters:
            - type: object
              mapping: "$."
        - name: "search-nearby-locations"
          description: "Returns up to 10 locations found near the given latitude and longitude."
          hints:
            readOnly: true
            destructive: false
            idempotent: true
          call: "content-api-location-search.searchForNearbyLocations"
          with:
            "latLong": "tools.latLong"
            "category": "tools.category"
            "phone": "tools.phone"
            "address": "tools.address"
            "radius": "tools.radius"
            "radiusUnit": "tools.radiusUnit"
            "language": "tools.language"
          outputParameters:
            - type: object
              mapping: "$."
