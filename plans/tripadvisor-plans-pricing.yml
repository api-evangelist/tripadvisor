specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Tripadvisor
providerId: tripadvisor
created: '2026-05-04'
# Provenance stamped 2026-08-11: this artifact was written by the API Evangelist
# bulk sweep dated 2026-05-04, not harvested from the provider. See roadmap#35.
method: generated
modified: '2026-05-05'
reconciled: true
tags:
  - Travel
  - Reviews
  - Hospitality
  - Content API
description: Tripadvisor Content API is pay-as-you-go with a free monthly allotment and a customer-set
  daily budget cap. The first 5,000 calls per month are free; beyond that, calls are billed on a
  sliding-scale tiered rate selected at checkout. Enterprise customers exceeding 500,000 calls per
  month are routed to sales for volume pricing.
sources:
  - https://tripadvisor-content-api.readme.io/reference/overview
  - https://tripadvisor-content-api.readme.io/reference/faq
  - https://www.tripadvisor.com/developers
plans:
  - id: tripadvisor-content-api-pay-as-you-go
    name: Content API Pay-As-You-Go
    type: pay-as-you-go
    description: Self-serve pay-as-you-go plan for the Tripadvisor Content API. Includes a free
      monthly call allotment, a user-selected daily budget cap, and sliding-scale tiered pricing
      beyond the free tier.
    entries:
      - label: Free Monthly Calls
        name: free_monthly_calls
        type: quota
        metric: request
        limit: 5000
        timeFrame: month
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: false
      - label: Search API Daily Cap
        name: search_daily_cap
        type: quota
        metric: request
        limit: 10000
        timeFrame: day
        geo: global
        unit: 1
        price: see plan dashboard
        userMultiplied: false
      - label: Daily Budget Cap
        name: daily_budget_cap
        type: quota
        metric: usd
        limit: -1
        timeFrame: day
        geo: global
        unit: 1
        price: customer-selected at signup
        userMultiplied: false
      - label: Metered API Calls
        name: metered_api_calls
        type: tiered
        metric: request
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: see tiered pricing at checkout / My Plans page
        userMultiplied: false
    elements:
      - name: Pay-Only-For-What-You-Use
      - name: Customer-Set Daily Budget
      - name: Sliding-Scale Volume Discounts
      - name: Cancel Anytime
  - id: tripadvisor-content-api-enterprise
    name: Content API Enterprise
    type: enterprise
    description: For consumers exceeding 500,000 API calls per month; volume pricing negotiated with
      Tripadvisor sales.
    entries:
      - label: Volume Calls
        name: volume_calls
        type: tiered
        metric: request
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: contact sales
        userMultiplied: false
    elements:
      - name: Volume Pricing
      - name: Sales-Negotiated Terms
