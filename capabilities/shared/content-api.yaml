naftiko: "1.0.0-alpha1"

info:
  label: "Tripadvisor Content API"
  description: "Access Tripadvisor's dataset of 7.5M+ locations, 1B+ reviews, photos, and travel content in 29 languages."
  tags:
    - Attractions
    - Hotels
    - Locations
    - Restaurants
    - Reviews
    - Travel
  created: "2026-05-03"
  modified: "2026-05-03"

binds:
  - namespace: env
    keys:
      TRIPADVISOR_API_KEY: TRIPADVISOR_API_KEY

capability:
  consumes:
    - type: http
      namespace: tripadvisor-content
      baseUri: "https://api.content.tripadvisor.com/api/v1"
      description: "Tripadvisor Content API for location data, reviews, and photos"
      authentication:
        type: apikey
        key: key
        value: "{{env.TRIPADVISOR_API_KEY}}"
        placement: query
      resources:
        - name: location-search
          path: /location/search
          description: "Search for locations by keyword or address"
          operations:
            - name: search-for-locations
              method: GET
              description: "Search for up to 10 locations by query, category, phone, address, or coordinates"
              inputParameters:
                - name: searchQuery
                  in: query
                  type: string
                  required: true
                  description: "Search query (name or keyword)"
                - name: category
                  in: query
                  type: string
                  required: false
                  description: "Filter by category: hotels, restaurants, attractions, geos"
                - name: language
                  in: query
                  type: string
                  required: false
                  description: "ISO 639 language code for response"
                - name: latLong
                  in: query
                  type: string
                  required: false
                  description: "Latitude and longitude for geographic context"
                - name: radius
                  in: query
                  type: integer
                  required: false
                  description: "Search radius"
                - name: radiusUnit
                  in: query
                  type: string
                  required: false
                  description: "km or mi"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: nearby-search
          path: /location/nearby_search
          description: "Search for locations near a geographic point"
          operations:
            - name: search-for-nearby-locations
              method: GET
              description: "Search for up to 10 locations near the given latitude/longitude"
              inputParameters:
                - name: latLong
                  in: query
                  type: string
                  required: true
                  description: "Latitude,longitude coordinates"
                - name: category
                  in: query
                  type: string
                  required: false
                  description: "Filter by category"
                - name: language
                  in: query
                  type: string
                  required: false
                  description: "ISO 639 language code"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: location-details
          path: /location/{locationId}/details
          description: "Retrieve comprehensive details for a specific location"
          operations:
            - name: get-location-details
              method: GET
              description: "Get name, address, rating, reviews count, and Tripadvisor URL for a location"
              inputParameters:
                - name: locationId
                  in: path
                  type: string
                  required: true
                  description: "Tripadvisor location identifier"
                - name: language
                  in: query
                  type: string
                  required: false
                  description: "ISO 639 language code"
                - name: currency
                  in: query
                  type: string
                  required: false
                  description: "ISO 4217 currency code"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: location-photos
          path: /location/{locationId}/photos
          description: "Retrieve recent high-quality photos for a location"
          operations:
            - name: get-location-photos
              method: GET
              description: "Get photos for a location in multiple size formats"
              inputParameters:
                - name: locationId
                  in: path
                  type: string
                  required: true
                  description: "Tripadvisor location identifier"
                - name: language
                  in: query
                  type: string
                  required: false
                  description: "ISO 639 language code"
                - name: limit
                  in: query
                  type: integer
                  required: false
                  description: "Number of photos to return"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: location-reviews
          path: /location/{locationId}/reviews
          description: "Retrieve the most recent reviews for a location"
          operations:
            - name: get-location-reviews
              method: GET
              description: "Get up to 5 most recent reviews for a location"
              inputParameters:
                - name: locationId
                  in: path
                  type: string
                  required: true
                  description: "Tripadvisor location identifier"
                - name: language
                  in: query
                  type: string
                  required: false
                  description: "ISO 639 language code for review content"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8100
      namespace: tripadvisor-content-rest
      resources:
        - path: /v1/locations/search
          name: location-search
          description: "Search for Tripadvisor locations"
          operations:
            - method: GET
              name: search-locations
              description: "Search for locations by keyword"
              call: "tripadvisor-content.search-for-locations"
              with:
                searchQuery: "rest.searchQuery"
                category: "rest.category"
                language: "rest.language"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/locations/{locationId}
          name: location-details
          description: "Get details for a Tripadvisor location"
          operations:
            - method: GET
              name: get-location
              description: "Get location details by ID"
              call: "tripadvisor-content.get-location-details"
              with:
                locationId: "rest.locationId"
                language: "rest.language"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/locations/{locationId}/reviews
          name: location-reviews
          description: "Get reviews for a location"
          operations:
            - method: GET
              name: get-reviews
              description: "Get recent reviews for a location"
              call: "tripadvisor-content.get-location-reviews"
              with:
                locationId: "rest.locationId"
                language: "rest.language"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/locations/{locationId}/photos
          name: location-photos
          description: "Get photos for a location"
          operations:
            - method: GET
              name: get-photos
              description: "Get recent photos for a location"
              call: "tripadvisor-content.get-location-photos"
              with:
                locationId: "rest.locationId"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9100
      namespace: tripadvisor-content-mcp
      transport: http
      tools:
        - name: search-locations
          description: "Search Tripadvisor for hotels, restaurants, or attractions by keyword"
          hints:
            readOnly: true
            openWorld: true
          call: "tripadvisor-content.search-for-locations"
          with:
            searchQuery: "tools.searchQuery"
            category: "tools.category"
            language: "tools.language"
          outputParameters:
            - type: object
              mapping: "$."
        - name: search-nearby-locations
          description: "Find Tripadvisor locations near a given latitude/longitude"
          hints:
            readOnly: true
            openWorld: true
          call: "tripadvisor-content.search-for-nearby-locations"
          with:
            latLong: "tools.latLong"
            category: "tools.category"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-location-details
          description: "Get comprehensive details for a Tripadvisor location including rating, address, and listing URL"
          hints:
            readOnly: true
            openWorld: false
          call: "tripadvisor-content.get-location-details"
          with:
            locationId: "tools.locationId"
            language: "tools.language"
            currency: "tools.currency"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-location-photos
          description: "Get recent high-quality photos for a Tripadvisor location"
          hints:
            readOnly: true
            openWorld: false
          call: "tripadvisor-content.get-location-photos"
          with:
            locationId: "tools.locationId"
            language: "tools.language"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-location-reviews
          description: "Get the most recent traveler reviews for a Tripadvisor location"
          hints:
            readOnly: true
            openWorld: false
          call: "tripadvisor-content.get-location-reviews"
          with:
            locationId: "tools.locationId"
            language: "tools.language"
          outputParameters:
            - type: object
              mapping: "$."
